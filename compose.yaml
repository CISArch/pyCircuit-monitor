services:
  pycircuit-monitor:
    build: .
    image: pycircuit-monitor:latest
    container_name: pycircuit-monitor
    restart: unless-stopped
    ports:
      - "4173:4173"
    volumes:
      # Host logs -> container log root read-only; LOG_ROOT points here by default.
      - ../auto_perf_logs:/data/auto_perf_logs:ro
      # Bot state DB (pending/running queue) read-only, for the queue rows.
      - ${AUTO_PERF_STATE_DIR:-/home/lidongzhe/.local/state/auto-perf}:/data/auto-perf-state:ro
    environment:
      # auto_perf bot (port 8790 on the host) for live queue/health proxy.
      AUTO_PERF_API_BASE: http://host.docker.internal:8790
      AUTO_PERF_STATE_DB: /data/auto-perf-state/state.sqlite3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Resource guardrails: this service is a tiny static+API server; hard caps
    # keep it from ever interfering with build/test workloads on this host.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 128M
    mem_limit: 128m
    cpus: 1.0
    # Restart early if the server process dies or gets OOM-killed repeatedly.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/autoperf/tasks').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
